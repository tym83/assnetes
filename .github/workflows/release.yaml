name: release

# A tag v<version> releases the distribution: the image of obrabotchik,
# the packages of the price list built from manifests in the 1C language,
# and the signed index at https://tym83.github.io/assnetes/index.yaml.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  KUBEPKG_REF: v1.3.0
  IMAGE: ghcr.io/${{ github.repository_owner }}/assnetes-obrabotchik
  REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/assnetes-packages
  BASE_INDEX: https://${{ github.repository_owner }}.github.io/assnetes/index.yaml

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The tag is the version of every package
        run: |
          v=${GITHUB_REF_NAME#v}
          sed -i -E "s/^  version: .*/  version: ${v}/" recipes/*/recipe.yaml
          # a release candidate requires the candidates of its members
          sed -i -E "s/version: \"~0\.1\"/version: \">=${v}\"/" recipes/assnetes/recipe.yaml recipes/kuberoot-assnetes/recipe.yaml
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
      - name: Manifests of the packages, with the image pinned
        run: IMAGE="${IMAGE}:${GITHUB_REF_NAME}@${{ steps.image.outputs.digest }}" hack/gen-recipes.sh
      - name: Install kubepkg
        run: go install "github.com/kuberoot-dev/kubepkg/cmd/kubepkg@${KUBEPKG_REF}"
      - name: Build the packages and the signed index
        env:
          KUBEPKG_SIGNING_KEY: ${{ secrets.KUBEPKG_SIGNING_KEY }}
        run: |
          dist=$(mktemp -d)
          for r in recipes/*/; do
            kubepkg build "$r" --registry "${REGISTRY}" -o "${dist}"
          done
          mkdir -p _site
          merge=()
          curl -fsSL -o /dev/null "${BASE_INDEX}" && merge=(--merge "${BASE_INDEX}")
          kubepkg repo index "${dist}" "${merge[@]}" --sign-key-env KUBEPKG_SIGNING_KEY -o _site/index.yaml
          cp keys/index.pub _site/index.pub
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  # 1сctl for people who want to try: a GitHub release with the binaries,
  # named in Latin, since GitHub mangles other letters in asset names.
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build 1сctl
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/} ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/tym83/assnetes/pkg/cli.Version=${GITHUB_REF_NAME}" \
              -o "dist/1sctl-${os}-${arch}${ext}" ./cmd/1sctl
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $pre
