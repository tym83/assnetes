Вид: АктСверки
ВидAPI: ReconciliationAct
Множественное: reconciliationacts
Описание: Сверка объектов кластера с манифестами в Git — «данными контрагента».
Реквизиты:
  Источник:
    Тип: Строка
    Обязательный: Да
    Описание: >-
      Откуда брать манифесты: адрес, от которого отсчитываются Файлы
      (https://raw.githubusercontent.com/организация/репозиторий/main), или
      «справочник:Подразделение/Имя» — манифесты в Справочнике кластера.
  Файлы: {Тип: Массив, Элемент: Строка, Обязательный: Да}
  Параметры: {Тип: Соответствие, Описание: Параметры манифестов}
  Подразделение: {Тип: Строка, Описание: "Куда манифесты проводятся, если не сказано иначе"}
  ПериодичностьМинут: {Тип: Целое, ПоУмолчанию: 10, Минимум: 1}
Состояние:
  ДатаСверки: Строка
  Сошлось: Булево
  Сверено: Целое
  Расхождений: Целое
  Расхождения:
    Тип: Массив
    Элемент:
      Реквизиты:
        Документ: Строка
        Поле: Строка
        ДанныеКонтрагента: Строка
        НашиДанные: Строка
  Акт: Строка
  Сообщение: Строка
Колонки:
  - {Имя: Сошлось, Путь: .status.Сошлось, Тип: Булево}
  - {Имя: Сверено, Путь: .status.Сверено, Тип: Целое}
  - {Имя: Расхождений, Путь: .status.Расхождений, Тип: Целое}
  - {Имя: Дата сверки, Путь: .status.ДатаСверки}
