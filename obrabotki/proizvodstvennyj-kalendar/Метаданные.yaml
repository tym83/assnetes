Вид: ПроизводственныйКалендарь
ВидAPI: ProductionCalendar
Множественное: productioncalendars
Описание: Производственный календарь страны на год и правила, когда выкатывать нельзя.
Реквизиты:
  Страна: {Тип: Строка, ПоУмолчанию: ru, Значения: [ru, by, kz, uz], Описание: Код страны календаря}
  Год: {Тип: Целое, Обязательный: Да, Минимум: 2013}
  ЧасовойПояс: {Тип: Строка, ПоУмолчанию: Europe/Moscow}
  Источник: {Тип: Строка, ПоУмолчанию: "https://xmlcalendar.ru/data"}
  ЗапретВыкатки:
    Реквизиты:
      ВПраздники: {Тип: Булево, ПоУмолчанию: true}
      ВВыходные: {Тип: Булево, ПоУмолчанию: true}
      ВСокращённыйДеньПослеЧаса: {Тип: Целое, ПоУмолчанию: 15, Минимум: 0, Максимум: 24}
      ВПятницуПослеЧаса: {Тип: Целое, ПоУмолчанию: 24, Минимум: 0, Максимум: 24, Описание: 24 — не запрещать}
Состояние:
  Загружен: Дата
  Сообщение: Строка
  Праздники: {Тип: Массив, Элемент: Строка}
  Дни:
    Тип: Массив
    Элемент:
      Реквизиты:
        Дата: Строка
        Тип: {Тип: Строка, Значения: [Выходной, Сокращённый, Рабочий]}
        Праздник: Строка
  РабочихДней: Целое
  СегодняРабочий: Булево
Колонки:
  - {Имя: Год, Путь: .spec.Год, Тип: Целое}
  - {Имя: Рабочих дней, Путь: .status.РабочихДней, Тип: Целое}
  - {Имя: Сегодня рабочий, Путь: .status.СегодняРабочий, Тип: Булево}
