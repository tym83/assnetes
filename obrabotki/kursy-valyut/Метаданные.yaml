Вид: КурсыВалют
ВидAPI: CurrencyRates
Множественное: currencyrates
Описание: Курсы валют ЦБ РФ и во что обходятся подразделения кластера по запросам ресурсов.
Реквизиты:
  Валюты: {Тип: Массив, Элемент: Строка, Описание: "Коды валют, например USD, EUR, CNY, KZT"}
  ЦенаЯдраВЧас: {Тип: Число, ПоУмолчанию: 1.2, Минимум: 0, Описание: Рублей за одно запрошенное ядро в час}
  ЦенаГигабайтаВЧас: {Тип: Число, ПоУмолчанию: 0.3, Минимум: 0, Описание: Рублей за гибибайт запрошенной памяти в час}
  Источник: {Тип: Строка, ПоУмолчанию: "https://www.cbr.ru"}
Состояние:
  НаДату: Строка
  Курсы:
    Тип: Массив
    Элемент:
      Реквизиты:
        Валюта: Строка
        Название: Строка
        Курс: Число
  Расходы:
    Тип: Массив
    Элемент:
      Реквизиты:
        Подразделение: Строка
        Ядер: Число
        ГигабайтПамяти: Число
        РублейВМесяц: Число
        ВВалютах: Соответствие
  ИтогоРублейВМесяц: Число
  Сообщение: Строка
Колонки:
  - {Имя: На дату, Путь: .status.НаДату}
  - {Имя: Итого руб/мес, Путь: .status.ИтогоРублейВМесяц, Тип: Число}
