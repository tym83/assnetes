Вид: ГлавнаяКнига
ВидAPI: Ledger
Множественное: ledgers
ВПодразделении: Да
Сокращения: [kniga]
Описание: >-
  Главная книга БухОпс: источник истины кластера. Объекты кластера — остатки
  по счетам, которые сложились из учтённых операций журнала; книга
  публикует их Flux как выписку (ExternalArtifact), а групповое
  перепроведение (Kustomization) разносит выписку по кластеру.
Реквизиты:
  ПланСчетов:
    Тип: Массив
    Обязательный: Да
    Элемент:
      Реквизиты:
        Код: {Тип: Строка, Обязательный: Да, Шаблон: '^[0-9А-Яа-яЁё.]+$'}
        Наименование: Строка
        Вид:
          Тип: Строка
          Значения: [Активный, Пассивный, АктивноПассивный]
          ПоУмолчанию: Активный
  ДатаЗапрета:
    Тип: Строка
    Шаблон: '^\d{4}-\d{2}-\d{2}'
    Описание: Дата запрета изменения данных. Операции с более ранней датой не принимаются.
  Подписанты:
    Тип: Массив
    Элемент: Строка
    Описание: >-
      Кто ставит вторую подпись: пользователи кластера. Пусто — любой, кроме
      автора операции.
  Подразделение:
    Тип: Строка
    Описание: Куда проводятся документы, у которых подразделение не указано
  ПериодичностьСверкиМинут: {Тип: Целое, ПоУмолчанию: 1, Минимум: 1}
  ИнтервалРазноски: {Тип: Строка, ПоУмолчанию: 5m, Описание: Как часто Flux перепроводит кластер по выписке}
Состояние:
  Ревизия: Строка
  Выписка: Строка
  УчтеноОпераций: Целое
  НеУчтеноОпераций: Целое
  Остатки:
    Тип: Массив
    Элемент:
      Реквизиты:
        Счёт: Строка
        Сальдо: Число
  Разнесено: Булево
  ДатаСверки: Строка
  Сошлось: Булево
  Расхождений: Целое
  Расхождения:
    Тип: Массив
    Элемент:
      Реквизиты:
        Документ: Строка
        Поле: Строка
        ПоУчёту: Строка
        ВКластере: Строка
  Сообщение: Строка
Колонки:
  - {Имя: Ревизия, Путь: .status.Ревизия}
  - {Имя: Разнесено, Путь: .status.Разнесено, Тип: Булево}
  - {Имя: Сошлось, Путь: .status.Сошлось, Тип: Булево}
  - {Имя: Расхождений, Путь: .status.Расхождений, Тип: Целое}
  - {Имя: Дата запрета, Путь: .spec.ДатаЗапрета}
