Вид: Операция
ВидAPI: Operation
Множественное: operations
ВПодразделении: Да
Сокращения: [op]
Описание: >-
  Хозяйственная операция журнала БухОпс: проводки Дт/Кт и, при
  необходимости, первичный документ — манифест на языке 1С. Операции не
  меняют и не удаляют: ошибку исправляет сторно.
Реквизиты:
  Книга: {Тип: Строка, Обязательный: Да}
  Дата: {Тип: Строка, Обязательный: Да, Шаблон: '^\d{4}-\d{2}-\d{2}'}
  Содержание: Строка
  Автор: {Тип: Строка, Описание: Кто составил операцию; 1сctl заполняет сам}
  Утвердил: {Тип: Строка, Описание: Вторая подпись}
  Проводки:
    Тип: Массив
    Элемент:
      Реквизиты:
        Дт: {Тип: Строка, Обязательный: Да}
        Кт: {Тип: Строка, Обязательный: Да}
        Сумма: {Тип: Число, Обязательный: Да}
        Содержание: Строка
  Первичка:
    Тип: Строка
    Описание: Первичный документ — манифест на языке 1С; Сальдо("01/Витрина") в нём — остаток по счёту
  Сторнирует: {Тип: Строка, Описание: Какую операцию отменяет эта}
Состояние:
  Учтена: Булево
  Причина: Строка
  Отпечаток: Строка
  СторнированаОперацией: Строка
Колонки:
  - {Имя: Дата, Путь: .spec.Дата}
  - {Имя: Содержание, Путь: .spec.Содержание}
  - {Имя: Автор, Путь: .spec.Автор}
  - {Имя: Утвердил, Путь: .spec.Утвердил}
  - {Имя: Учтена, Путь: .status.Учтена, Тип: Булево}
  - {Имя: Причина, Путь: .status.Причина}
