Вид: ИнформационнаяБаза
ВидAPI: Infobase
Множественное: infobases
ВПодразделении: Да
Сокращения: [ib]
Описание: Информационная база на кластере серверов — база данных в СУБД и её регистрация в кластере.
Реквизиты:
  КластерСерверов: {Тип: Строка, Обязательный: Да}
  Шаблон:
    Описание: "Откуда взять конфигурацию: файл .cf или выгрузка .dt"
    Реквизиты:
      ШаблонКонфигурации: {Тип: Строка, Описание: "Шаблон конфигурации из прайс-листа"}
      Справочник: {Тип: Строка, Описание: "Справочник с файлом"}
      Ключ: {Тип: Строка, Описание: "Имя файла в справочнике"}
      URL: {Тип: Строка, Описание: "Или адрес файла"}
  Редакция: {Тип: Строка, ПоУмолчанию: ПРОФ, Значения: [Базовая, ПРОФ, КОРП]}
  УдалятьБазуДанных: {Тип: Булево, ПоУмолчанию: false, Описание: "При удалении объекта удалить и базу в СУБД"}
Состояние:
  Фаза: Строка
  Зарегистрирована: Булево
  Конфигурация: Строка
  Сообщение: Строка
Колонки:
  - {Имя: Кластер, Путь: .spec.КластерСерверов}
  - {Имя: Фаза, Путь: .status.Фаза}
  - {Имя: Конфигурация, Путь: .status.Конфигурация}
