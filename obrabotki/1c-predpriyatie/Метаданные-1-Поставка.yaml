Вид: Поставка
ВидAPI: Platform
Множественное: platforms
Описание: Версия платформы 1С:Предприятие и откуда её брать. Дистрибутивы фирмы «1С» не распространяются — архив приносите свой.
Реквизиты:
  Версия: {Тип: Строка, Обязательный: Да, Шаблон: "^8\\.[35]\\.[0-9]+\\.[0-9]+$", Описание: "Например 8.3.27.1606"}
  Заглушка: {Тип: Булево, ПоУмолчанию: false, Описание: "Вместо платформы — заглушка Assnetes, для проверки без 1С"}
  Образ: {Тип: Строка, Описание: "Образ сервера: основа с библиотеками для 1С или заглушка"}
  Архив: {Тип: Строка, Описание: "Адрес архива server64_<версия>.tar.gz для Linux (с developer.1c.ru или releases.1c.ru, выложенный у вас)"}
  ОбразСУБД: {Тип: Строка, Описание: "Образ PostgreSQL для 1С для CloudNativePG"}
Состояние:
  Готова: Булево
  Путь: Строка
  Сообщение: Строка
Колонки:
  - {Имя: Версия, Путь: .spec.Версия}
  - {Имя: Заглушка, Путь: .spec.Заглушка, Тип: Булево}
  - {Имя: Готова, Путь: .status.Готова, Тип: Булево}
