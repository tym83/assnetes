Вид: ШаблонКонфигурации
ВидAPI: ConfigurationTemplate
Множественное: configurationtemplates
Описание: Шаблон конфигурации или её обновления — .cf, .cfu, .cfe или .dt. Пакеты прайс-листа поставляют шаблоны для заглушки; настоящие файлы приносите свои, по адресу.
Реквизиты:
  Конфигурация: {Тип: Строка, Обязательный: Да, Описание: "Имя конфигурации, например БухгалтерияПредприятия"}
  Синоним: Строка
  Версия: {Тип: Строка, Обязательный: Да}
  ВидФайла: {Тип: Строка, ПоУмолчанию: cf, Значения: [cf, cfu, cfe, dt]}
  Поставщик: Строка
  МинимальнаяПлатформа: {Тип: Строка, Описание: "Не ниже какой версии платформы"}
  URL: {Тип: Строка, Описание: "Адрес файла"}
  Содержимое: {Тип: Строка, Описание: "Сам файл, если он текстовый и небольшой: шаблоны заглушки"}
Колонки:
  - {Имя: Конфигурация, Путь: .spec.Конфигурация}
  - {Имя: Версия, Путь: .spec.Версия}
  - {Имя: Файл, Путь: .spec.ВидФайла}
