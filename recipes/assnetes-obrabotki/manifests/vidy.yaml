apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    xn--80ajopdiccfkc.xn--90a0bg/naimenovanie: ПроизводственныйКалендарь
  name: productioncalendars.xn--80ajopdiccfkc.xn--90a0bg
spec:
  group: xn--80ajopdiccfkc.xn--90a0bg
  names:
    categories:
      - assnetes
    kind: ProductionCalendar
    listKind: ProductionCalendarList
    plural: productioncalendars
    singular: productioncalendar
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.Год
          name: Год
          type: integer
        - jsonPath: .status.РабочихДней
          name: Рабочих дней
          type: integer
        - jsonPath: .status.СегодняРабочий
          name: Сегодня рабочий
          type: boolean
        - jsonPath: .metadata.creationTimestamp
          name: Возраст
          type: date
      name: v1
      schema:
        openAPIV3Schema:
          description: Производственный календарь страны на год и правила, когда людям нельзя ничего менять в кластере.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              properties:
                Год:
                  minimum: 2013
                  type: integer
                ЗапретВыкатки:
                  properties:
                    ВВыходные:
                      default: true
                      type: boolean
                    ВПраздники:
                      default: true
                      type: boolean
                    ВПятницуПослеЧаса:
                      default: 24
                      description: 24 — не запрещать
                      maximum: 24
                      minimum: 0
                      type: integer
                    ВСокращённыйДеньПослеЧаса:
                      default: 15
                      maximum: 24
                      minimum: 0
                      type: integer
                    ДнейДоПраздников:
                      default: 7
                      description: За сколько дней до майских и новогодних всё замирает
                      maximum: 31
                      minimum: 0
                      type: integer
                    ОбедДоЧаса:
                      default: 14
                      description: Равен началу — без обеда
                      maximum: 24
                      minimum: 0
                      type: integer
                    ОбедСЧаса:
                      default: 13
                      description: Обед в рабочие дни по местному времени календаря
                      maximum: 24
                      minimum: 0
                      type: integer
                    ПередМайскими:
                      default: true
                      description: Давайте уже после майских
                      type: boolean
                    ПередНовымГодом:
                      default: true
                      description: Давайте уже после праздников
                      type: boolean
                  type: object
                Источник:
                  default: https://xmlcalendar.ru/data
                  type: string
                Страна:
                  default: ru
                  description: Код страны календаря
                  enum:
                    - ru
                    - by
                    - kz
                    - uz
                  type: string
                ЧасовойПояс:
                  default: Europe/Moscow
                  type: string
              required:
                - Год
              type: object
            status:
              properties:
                Дни:
                  items:
                    properties:
                      Дата:
                        type: string
                      Праздник:
                        type: string
                      Тип:
                        enum:
                          - Выходной
                          - Сокращённый
                          - Рабочий
                        type: string
                    type: object
                  type: array
                Загружен:
                  format: date-time
                  type: string
                Праздники:
                  items:
                    type: string
                  type: array
                РабочихДней:
                  type: integer
                СегодняРабочий:
                  type: boolean
                Сообщение:
                  type: string
              type: object
              x-kubernetes-preserve-unknown-fields: true
          type: object
      served: true
      storage: true
      subresources:
        status: {}
---
