  annotations:
    kubepkg.dev/description: "Обработки 1Ж:Оркестратора 8: производственный календарь, курсы валют, дата запрета изменения, удаление помеченных, акт сверки"
    kubepkg.dev/home: https://github.com/tym83/assnetes
spec:
