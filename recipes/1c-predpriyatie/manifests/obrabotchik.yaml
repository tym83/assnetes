apiVersion: v1
kind: ServiceAccount
metadata:
  name: obrabotchik-1c
  namespace: assnetes-1c
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obrabotchik-1c-assnetes-1c
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: obrabotchik-1c
    namespace: assnetes-1c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obrabotchik-1c
  namespace: assnetes-1c
  labels:
    prilozhenie: obrabotchik-1c
  annotations:
    xn--80ajopdiccfkc.xn--90a0bg/metki: '{"prilozhenie":"приложение=obrabotchik-1c"}'
    xn--80ajopdiccfkc.xn--90a0bg/imena: '{"obrabotchik":"обработчик"}'
spec:
  replicas: 2
  selector:
    matchLabels:
      prilozhenie: obrabotchik-1c
  template:
    metadata:
      labels:
        prilozhenie: obrabotchik-1c
      annotations:
        xn--80ajopdiccfkc.xn--90a0bg/metki: '{"prilozhenie":"приложение=obrabotchik-1c"}'
    spec:
      serviceAccountName: obrabotchik-1c
      containers:
        - name: obrabotchik
          image: ghcr.io/tym83/assnetes-obrabotchik:main
          imagePullPolicy: Always
          args:
            - --service=obrabotchik-1c
            - --id=obrabotchik-1c
            - --namespace=assnetes-1c
            - --vidy=false
            - /obrabotki/1c-predpriyatie
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          ports:
            - name: proverki
              containerPort: 9443
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: obrabotchik-1c
  namespace: assnetes-1c
  annotations:
    xn--80ajopdiccfkc.xn--90a0bg/metki: '{"prilozhenie":"приложение=obrabotchik-1c"}'
spec:
  selector:
    prilozhenie: obrabotchik-1c
  ports:
    - port: 443
      targetPort: 9443
