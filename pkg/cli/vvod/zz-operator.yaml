apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepkg
  namespace: kubepkg-system
  labels:
    app.kubernetes.io/name: kubepkg
    app.kubernetes.io/instance: kubepkg
    app.kubernetes.io/version: "1.3.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubepkg
      app.kubernetes.io/instance: kubepkg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubepkg
        app.kubernetes.io/instance: kubepkg
        app.kubernetes.io/version: "1.3.0"
    spec:
      serviceAccountName: kubepkg
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: "ghcr.io/kuberoot-dev/kubepkg-operator:1.3.0"
          imagePullPolicy: IfNotPresent
          args:
            - --backend=helm
            - --api-group=xn--80akoss8c.xn--90a0bg
            - --leader-elect=true
            - --package-workers=4
            - --retry-backoff=30s
            - --retry-backoff-max=10m
            - --cache-dir=/var/cache/kubepkg
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            # Helm keeps its own files under HOME; the root filesystem is read-only.
            - {name: HOME, value: /tmp}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: probes, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: cache, mountPath: /var/cache/kubepkg}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: cache, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
