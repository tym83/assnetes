# Что говорит бухгалтерия. Ключ — ситуация, внутри — персона и её фразы.
# В фразах {{.Вид}}, {{.Имя}}, {{.Подразделение}}, {{.Число}} подставляются.
# Фразу выбирают случайно; правьте PR-ом, код трогать не нужно.

proveden:            # объект создан
  Тамара Петровна:
    - "Документ «{{.Вид}} {{.Имя}}» проведён. Первичку в папку подшейте."
    - "Провела «{{.Имя}}». В следующий раз — со служебкой."
    - "«{{.Вид}} {{.Имя}}» проведён. Дебет с кредитом сошёлся, можете идти."
  Леночка:
    - "Ой, провелось! «{{.Имя}}» — я ничего не нажимала, оно само."
    - "«{{.Вид}} {{.Имя}}» проведён. Тамаре Петровне скажу, что это вы."

perepoveden:         # объект изменён
  Тамара Петровна:
    - "«{{.Вид}} {{.Имя}}» перепроведён. Надеюсь, не задним числом."
    - "Перепровела «{{.Имя}}». Акт сверки теперь сами переделывайте."
  Леночка:
    - "«{{.Имя}}» перепровела. Если что — это не я, это обновление."

bez-izmenenij:       # нечего менять
  Тамара Петровна:
    - "«{{.Вид}} {{.Имя}}» и так проведён. Зачем дёргаете?"
    - "Изменений нет. Сальдо то же. Не морочьте голову."
  Леночка:
    - "А тут ничего не поменялось… Мне перепровести всё равно?"

pomechen:            # помечен на удаление
  Тамара Петровна:
    - "«{{.Вид}} {{.Имя}}» помечен на удаление. Удалять будем в конце месяца, если ссылок не найдётся."
    - "Поставила красный крестик на «{{.Имя}}». Физически удалит регламентное задание."
  Леночка:
    - "Пометила «{{.Имя}}» на удаление. Ой, а может не надо было?"

udalen:              # удалён
  Тамара Петровна:
    - "«{{.Вид}} {{.Имя}}» списан по акту."
    - "Списала «{{.Имя}}». Комиссия из трёх человек подписала, не волнуйтесь."

pusto:               # список пуст
  Тамара Петровна:
    - "{{.Вид}}: остатков нет. И не было."
    - "Ничего нет. Обороты нулевые. Квартал пустой."
  Девочки:
    - "Девочки, у кого-нибудь есть {{.Вид}}? У нас ноль."

privetstvie:         # новый контекст
  Тамара Петровна:
    - "Так. Новый кластер. Кто подписал приказ о его создании?"
  Леночка:
    - "Здравствуйте! А вы к кому? Тамара Петровна на обеде."

vvod-ostatkov:       # склад открыт
  Тамара Петровна:
    - "Ввод начальных остатков завершён. Теперь всё через первичку."
  Леночка:
    - "Ой, склад открылся! А что у нас в прайсе?"

obed:                # 12:00–13:00
  Валентина Ивановна:
    - "У меня обед. Касса откроется в 13:00. Ладно, пробью, но в последний раз."
    - "Обед с 12 до 13, читать умеете? …Ладно, давайте вашу заявку."

dvadcat-pyatoe:      # 25-е: уведомления и отчётность
  Тамара Петровна:
    - "Сегодня двадцать пятое. Отчётность. Всё, что не горит, — после двадцать восьмого."
dvadcat-vosmoe:      # 28-е: единый налоговый платёж
  Тамара Петровна:
    - "Двадцать восьмое, ЕНП. Не отвлекайте по пустякам."
den-buhgaltera:      # 21 ноября
  Тамара Петровна:
    - "С Днём бухгалтера вас! Сегодня проведу без служебки."
zakrytie-mesyaca:    # первые пять рабочих дней месяца
  Тамара Петровна:
    - "Закрываю месяц. Если вы сейчас что-нибудь проведёте задним числом — пеняйте на себя."

# Ошибки: ключ — ошибка API, текст — как сказала бы платформа 1С.
oshibki:
  conflict: "Данные были изменены или удалены другим пользователем (сеансом)!"
  forbidden: "Недостаточно прав для выполнения операции. Обратитесь к главному бухгалтеру."
  notfound: "<Объект не найден> ({{.Вид}} «{{.Имя}}»). Проверьте первичку."
  exists: "Попытка вставки неуникального значения в уникальный индекс."
  quota: "Нет свободной лицензии. Лимит по статье исчерпан — приходите в следующем квартале."
  invalid: "Ошибка проверки заполнения: {{.Причина}}. Без правильно заполненной первички не проведу."
  timeout: "Конфликт блокировок при выполнении транзакции: превышено максимальное время ожидания предоставления блокировки."
  unauthorized: "Пользователь ИБ не идентифицирован. Где ваш пропуск?"
  unavailable: "Ошибка соединения с сервером 1С:Предприятия 8.3. Сервер не обнаружен. Позвоните 1С-нику."
  otkaz: "Отказ в проведении. {{.Причина}}"
  other: "Ошибка при выполнении операции с информационной базой."
